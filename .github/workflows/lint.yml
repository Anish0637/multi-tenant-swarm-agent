name: Lint & Format

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort

    - name: Check formatting with black
      run: black --check agents/ mcp_server/ registry/ access_control/ tests/

    - name: Check imports with isort
      run: isort --profile black --check-only agents/ mcp_server/ registry/ access_control/ tests/

    - name: Lint with flake8
      run: flake8 agents/ mcp_server/ registry/ access_control/ tests/
