name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 agents/ mcp_server/ registry/ access_control/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 agents/ mcp_server/ registry/ access_control/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type checking with mypy
      run: |
        pip install mypy
        mypy agents/ mcp_server/ registry/ access_control/ --ignore-missing-imports || true
    
    - name: Run tests with pytest
      run: |
        pip install pytest pytest-cov pytest-asyncio
        pytest tests/ -v --cov=agents --cov=mcp_server --cov=registry --cov=access_control --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
