# .github/workflows/deploy.yml
# CI/CD: test → build images → push to ECR → deploy to ECS
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION            (e.g. us-east-1)
#   AWS_ACCOUNT_ID        (12-digit account number)
#   OPENAI_API_KEY        (stored in Secrets Manager, only used for integration tests)
#   API_KEYS              (comma-separated list of valid API keys)

name: CI/CD — Build, Test, Deploy

on:
  push:
    branches:
      - main          # → deploy to production
      - staging       # → deploy to staging
  pull_request:
    branches:
      - main
      - staging       # → CI only (test + build, no deploy)

env:
  AWS_REGION:      ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID:  ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_MCP:         ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/mcp-server
  ECR_AGENTS:      ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/multi-tenant-swarm-agent
  ECS_CLUSTER:     swarm-agent-cluster

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────
  # JOB 1: Lint + Unit Tests
  # ────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,*.egg-info

      - name: Unit tests
        env:
          OPENAI_API_KEY: sk-test-dummy-key          # real key not needed for unit tests
          ENV: development
        run: |
          pytest tests/ \
            -m "not integration and not slow" \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker Images + Push to ECR
  # Runs on push to main/staging only
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image_tag:    ${{ steps.meta.outputs.image_tag }}
      short_sha:    ${{ steps.meta.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA"          >> $GITHUB_OUTPUT
          echo "image_tag=$SHORT_SHA"          >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build all four images in parallel using matrix would require separate jobs.
      # Here we build sequentially but with layer caching for speed.

      - name: Build + push MCP Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: true
          tags: |
            ${{ env.ECR_MCP }}:latest
            ${{ env.ECR_MCP }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=registry,ref=${{ env.ECR_MCP }}:cache
          cache-to:   type=registry,ref=${{ env.ECR_MCP }}:cache,mode=max

      - name: Build + push Agents
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.agent
          push: true
          tags: |
            ${{ env.ECR_AGENTS }}:latest
            ${{ env.ECR_AGENTS }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=registry,ref=${{ env.ECR_AGENTS }}:cache
          cache-to:   type=registry,ref=${{ env.ECR_AGENTS }}:cache,mode=max

      - name: Build + push Public API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.ECR_AGENTS }}:api
            ${{ env.ECR_AGENTS }}:api-${{ steps.meta.outputs.image_tag }}
          cache-from: type=registry,ref=${{ env.ECR_AGENTS }}:api-cache
          cache-to:   type=registry,ref=${{ env.ECR_AGENTS }}:api-cache,mode=max

      - name: Build + push Webapp
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.webapp
          push: true
          tags: |
            ${{ env.ECR_AGENTS }}:webapp
            ${{ env.ECR_AGENTS }}:webapp-${{ steps.meta.outputs.image_tag }}
          cache-from: type=registry,ref=${{ env.ECR_AGENTS }}:webapp-cache
          cache-to:   type=registry,ref=${{ env.ECR_AGENTS }}:webapp-cache,mode=max

  # ────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Staging (branch: staging)
  # ────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Deploy all services to staging
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          CLUSTER: swarm-agent-cluster-staging
        run: |
          bash .github/scripts/deploy-ecs.sh \
            --cluster  "$CLUSTER" \
            --env      staging \
            --tag      "$IMAGE_TAG"

      - name: Smoke test staging
        run: |
          STAGING_URL=$(aws elbv2 describe-load-balancers \
            --names swarm-agent-alb-staging \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          bash .github/scripts/smoke-test.sh "http://$STAGING_URL"

  # ────────────────────────────────────────────────────────────────
  # JOB 4: Deploy to Production (branch: main)
  # ────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production      # requires manual approval in GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Deploy all services to production
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          bash .github/scripts/deploy-ecs.sh \
            --cluster  "$ECS_CLUSTER" \
            --env      production \
            --tag      "$IMAGE_TAG"

      - name: Smoke test production
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names swarm-agent-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          bash .github/scripts/smoke-test.sh "http://$ALB_DNS"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *Swarm Agent* deployed to production — <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ needs.build.outputs.short_sha }}>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *Swarm Agent* production deploy FAILED — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
